name: Deploy Smart Planner

on:
  push:
    branches:
      - main

concurrency:
  group: smart-planner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          set -e

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd /opt/smart_planner
            git pull origin main
            docker network inspect ecosystem >/dev/null 2>&1 || docker network create ecosystem
            docker compose rm -fsv migrator || true
            docker ps -aq --filter "name=_smart_planner-" | xargs -r docker rm -f
            docker compose up -d --build --remove-orphans
            docker compose rm -fsv migrator || true
            docker image prune -f
          "